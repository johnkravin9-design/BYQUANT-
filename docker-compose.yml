services:
  postgres:
    image: postgres:16-alpine
    container_name: byquant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-byquant}
      POSTGRES_USER: ${POSTGRES_USER:-byquant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-byquant} -d ${POSTGRES_DB:-byquant}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
